<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS Example</title>
    
    
    <style>
   
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

 
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }

      
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        /* Paragraph styling */
        p {
            color: #555555;
            line-height: 1.6;
        }

    
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            margin-top: 15px;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

    
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
 
</head>
<body>

    <div class="card">
        <h1>Hello World!</h1>
        <p>This is a simple webpage example demonstrating how to use <strong>Internal CSS</strong> inside the HTML file.</p>
        <a href="#" class="btn">Click Me</a>
    </div>

</body>
</html>
